<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forage</title>
  <meta name="description" content="Your book library: wishlist, reading, and everything you've read.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="theme-color" content="#FBFBF9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Forage">
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="js/main.js">
</head>
<body data-view="wishlist">
  <header class="top">
    <div class="top-line">
      <span class="wordmark">Forage</span>
      <button id="sync-btn" class="sync" data-act="settings"><span class="dot" aria-hidden="true"></span><span class="sync-text">Loading…</span></button>
    </div>
    <form id="search" class="search" role="search">
      <label class="sr" for="q">Search your library</label>
      <svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Search your books">
      <button id="q-clear" type="button" class="q-clear" aria-label="Clear search" hidden><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
    </form>
  </header>

  <main id="main" tabindex="-1"><div class="empty"><p class="empty-title">Loading your library…</p></div></main>

  <nav class="tabbar" aria-label="Shelves">
    <button class="tab" data-tab="wishlist" aria-current="page"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg><span class="tab-label">Wishlist</span><span class="tab-count" data-count="wishlist"></span></button>
    <button class="tab" data-tab="to_read" aria-current="false"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 3h12v18H6zM9.5 3v18"/></svg><span class="tab-label">To Read</span><span class="tab-count" data-count="to_read"></span></button>
    <button class="tab" data-tab="reading" aria-current="false"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 5c3-1 6-1 9 1.5C15 4 18 4 21 5v14c-3-1-6-1-9 1.5C9 18 6 18 3 19zM12 6.5v14"/></svg><span class="tab-label">Reading</span><span class="tab-count" data-count="reading"></span></button>
    <button class="tab" data-tab="history" aria-current="false"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"><path d="M4 20h16M5 16h14M6 12h12M7 8h10"/></svg><span class="tab-label">History</span><span class="tab-count" data-count="history"></span></button>
    <button class="tab tab-sub" data-tab="undated" aria-current="false"><span class="tab-label">Needs a date</span><span class="tab-count" data-count="undated"></span></button>
    <button class="add-btn" data-act="add" aria-label="Add a book"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 4v16M4 12h16"/></svg><span class="add-label">Add a book</span></button>
  </nav>

  <div id="detail" class="panel" role="dialog" aria-modal="true" aria-label="Book" hidden></div>
  <div id="sheet" class="panel sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
