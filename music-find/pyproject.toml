[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-find"
version = "0.1.0"
description = "Find artists and albums in beets and on a NAS"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
music-find = "music_find.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
