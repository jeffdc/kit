<title>mull serve</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Red+Hat+Mono:wght@400;500;600&display=swap">
<style>
/* An issued drawing set: sheet-index rail on the left, a title block on every sheet, schedules for lists, revision clouds for what changed. */
:root {
  --ground: #FFFFFF;
  --panel: #EEF2F6;
  --ink: #121417;
  --mut: #565F6B;
  --faint: #69717C;
  --line: #8DB0D6;      /* construction lines: minor rules, guides */
  --red: #D2232A;       /* revision only: clouds and deltas */
  --sel: #DCE6F1;
  --blue: #2E58C2;      /* blueline ink: now, active, selected */
  --blue-soft: #E3EBFA;
  --green: #2B7A48;     /* checker's green: done, accepted, passed */
  --hl: #FFE14D;        /* highlighter: blocking, needs you first */
  --hl-ink: #121417;
  --rail: #EEF3FB;      /* blueline paper: the sheet index */
  --rail-sel: #DDE7F8;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "Red Hat Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101215; --panel: #181C21; --ink: #E6E9ED; --mut: #A2ABB6; --faint: #828B97;
    --line: #34506F; --red: #FF5D5D; --sel: #1F2A37; color-scheme: dark;
    --blue: #86A8F5; --blue-soft: #1B2740; --green: #6CC48B; --hl: #F0CF45; --hl-ink: #101215; --rail: #131A25; --rail-sel: #1E2B42;
  }
}
:root[data-theme="dark"] {
  --ground: #101215; --panel: #181C21; --ink: #E6E9ED; --mut: #A2ABB6; --faint: #828B97;
  --line: #34506F; --red: #FF5D5D; --sel: #1F2A37; color-scheme: dark;
    --blue: #86A8F5; --blue-soft: #1B2740; --green: #6CC48B; --hl: #F0CF45; --hl-ink: #101215; --rail: #131A25; --rail-sel: #1E2B42;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 13.5px/1.45 var(--font); scrollbar-color: var(--line) transparent; }
::selection { background: var(--sel); color: var(--ink); }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
button { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
code, .mono { font-family: var(--mono); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.lab { font-size: 11px; font-weight: 650; font-stretch: 75%; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); }
.mut { color: var(--mut); } .faint { color: var(--faint); }
svg.ic { width: 10px; height: 10px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; }

/* shell */
.app { display: grid; grid-template-columns: 312px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--rail); border-right: 1.5px solid var(--ink); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.brand { height: 56px; flex: none; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.brand .live { margin-left: auto; }
.brand b { font-size: 22px; font-weight: 800; font-stretch: 112%; letter-spacing: -.01em; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.tree { flex: 1; overflow-y: auto; padding: 6px 0 12px; }
.node { display: flex; align-items: center; gap: 7px; height: 29px; padding: 0 12px 0 calc(10px + var(--d) * 14px); white-space: nowrap; position: relative; }
.node .guides { position: absolute; inset: 0 auto 0 0; width: calc(10px + var(--d) * 14px); background: repeating-linear-gradient(90deg, transparent 0 15px, var(--line) 15px 16px, transparent 16px 28px) 4px 0 / calc(var(--d) * 14px) 100% no-repeat; pointer-events: none; }
.node .tg { width: 16px; height: 16px; display: grid; place-items: center; border: 0; background: none; padding: 0; cursor: pointer; color: var(--mut); flex: none; }
.node .tg svg { transition: transform .15s ease-out; }
.node .tg[aria-expanded="true"] svg { transform: rotate(90deg); }
.node .tg.leaf { visibility: hidden; }
.node .x { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.node .x code { font-size: 11px; margin-right: 6px; }
.node em { font: 600 11px var(--font); font-stretch: 78%; letter-spacing: .03em; font-style: normal; color: var(--mut); flex: none; font-variant-numeric: tabular-nums; }
.node.top .x { font-weight: 700; }
.node.cur { background: var(--rail-sel); box-shadow: inset 3px 0 var(--blue); }
.node.cur .x { color: var(--blue); }
.node.cur .x { font-weight: 700; }
.node.waits .x, .node.waits em { color: var(--faint); }
.node:hover { background: var(--rail-sel); }
.node a:hover { text-decoration: none; }
.brand .idx-toggle { display: none; }
.rail-foot { flex: none; border-top: 1px solid var(--line); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.rail-foot p { margin: 4px 0 0; font: 400 11.5px/1.6 var(--mono); color: var(--faint); }
.rail-foot .row2 { display: flex; gap: 8px; flex-wrap: wrap; }

/* stamps, tags, deltas */
.stamp { background: var(--hl); color: var(--hl-ink); box-shadow: 0 0 0 1px var(--hl-ink) inset; font-size: 11px; font-weight: 700; font-stretch: 72%; letter-spacing: .08em; text-transform: uppercase; padding: 2px 5px; line-height: 1.2; flex: none; white-space: nowrap; }
.tag { display: inline-block; font-size: 11px; font-weight: 650; font-stretch: 72%; letter-spacing: .09em; text-transform: uppercase; border: 1px solid currentColor; padding: 1px 5px; line-height: 1.3; white-space: nowrap; flex: none; }
.s-captured { border-style: dashed; color: var(--mut); }
.s-committed { color: var(--mut); }
.s-ready { color: var(--blue); }
.s-active { background: var(--blue); color: var(--ground); border-color: var(--blue); }
.s-review { border: 3px double var(--ink); padding: 0 4px; }
.s-done { color: var(--green); border-color: currentColor; }
.s-pass { background: var(--green); color: var(--ground); border-color: var(--green); }
.s-dropped { color: var(--faint); text-decoration: line-through; }
.s-waits { color: var(--faint); border-style: dotted; }
.s-shaping { color: var(--mut); border-style: dashed; }
.s-now { color: var(--blue); border-width: 1.5px; }
.cl { position: relative; }
.cl::before { content: ""; position: absolute; inset: -6px -10px; pointer-events: none; z-index: 1;
  background:
    radial-gradient(circle at 50% 100%, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 0 0 / 12px 7px round no-repeat,
    radial-gradient(circle at 50% 0, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 0 100% / 12px 7px round no-repeat,
    radial-gradient(circle at 100% 50%, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 0 0 / 7px 12px no-repeat round,
    radial-gradient(circle at 0 50%, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 100% 0 / 7px 12px no-repeat round; }
/* table rows: each cell draws its share of the cloud; the end cells close it */
tr.cl::before { display: none; }
tr.cl > td { position: relative; border-bottom-color: transparent; }
tr.cl > td::after { content: ""; position: absolute; inset: 1px 0; pointer-events: none;
  background:
    radial-gradient(circle at 50% 100%, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 0 0 / 12px 7px repeat-x,
    radial-gradient(circle at 50% 0, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 0 100% / 12px 7px repeat-x; }
tr.cl > td:first-child::after { background:
    radial-gradient(circle at 50% 100%, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 0 0 / 12px 7px repeat-x,
    radial-gradient(circle at 50% 0, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 0 100% / 12px 7px repeat-x,
    radial-gradient(circle at 0 50%, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 0 0 / 7px 12px repeat-y; }
tr.cl > td:last-child::after { background:
    radial-gradient(circle at 50% 100%, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 0 0 / 12px 7px repeat-x,
    radial-gradient(circle at 50% 0, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 0 100% / 12px 7px repeat-x,
    radial-gradient(circle at 100% 50%, #0000 4.7px, var(--red) 5.1px 6.1px, #0000 6.5px) 100% 0 / 7px 12px repeat-y; }
tr.cl + tr > td { border-top: 0; }
tr.cl.cl-cont > td::after { background-size: 12px 0, 12px 7px, 7px 12px; top: 0; }
tr.cl.cl-open > td::after { background-size: 12px 7px, 12px 0, 7px 12px; bottom: 0; }
tr.cl.cl-cont.cl-open > td::after { background-size: 12px 0, 12px 0, 7px 12px; }
tr.cl > td:last-child { position: relative; }
.cl.fading > td::after { transition: opacity .35s ease-out; opacity: 0; }
.cl.fresh::before { animation: draw .7s cubic-bezier(.16, 1, .3, 1); }
td > .prose .cl { position: relative; }
.pj .cl { position: relative; display: inline; }
.pj .cl::before { inset: -8px -12px; }
.pj .cl .tree .tcl { position: relative; margin: 7px 0; }
.tree .tcl::before { inset: -5px 3px; }
.tree .tcl .pr.cl .cl.fading::before { transition: opacity .35s ease-out, clip-path .35s ease-out; opacity: 0; clip-path: inset(0 0 0 100%); }
@keyframes draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

/* cell bars: one cell per item */
.cells { display: inline-flex; border: 1px solid var(--ink); height: 9px; flex: none; vertical-align: middle; }
.cells i { width: 8px; height: 100%; border-left: 1px solid var(--line); }
.cells i:first-child { border-left: 0; }
.cells i.d1 { background: var(--green); border-color: var(--green); }
.cells i.r1 { background: repeating-linear-gradient(135deg, var(--ink) 0 1.5px, transparent 1.5px 3.5px); }
.cells i.a1 { background: var(--blue-soft); box-shadow: inset 0 -3px var(--blue); }

/* buttons */
.btn { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--ink); background: var(--ground); color: var(--ink); font: 600 12px var(--font); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn.p { background: var(--ink); color: var(--ground); }
.btn.p:hover { opacity: .88; }
.btn.s { height: 24px; padding: 0 10px; font-size: 11.5px; }
.btn[disabled] { opacity: .45; cursor: default; }

/* main + title block */
main { min-width: 0; display: flex; flex-direction: column; }
.tb { display: grid; grid-template-columns: minmax(280px, 1.5fr) repeat(3, minmax(0, 1fr)); border-bottom: 1.5px solid var(--ink); }
.tb > .f { padding: 9px 18px 10px; border-left: 1px solid var(--line); min-width: 0; }
.tb > .f:nth-child(n+5) { border-top: 1px solid var(--line); }
.tb.wide { grid-template-columns: minmax(380px, 3fr) repeat(3, minmax(0, 1fr)); }
.tb .pj { grid-row: span 2; border-left: 0; padding: 12px clamp(16px, 2.4vw, 32px); display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
.pj h1 { font-size: clamp(24px, 2.6vw, 34px); line-height: 1.05; font-weight: 800; font-stretch: 118%; letter-spacing: -.015em; }
.pj h1.long { font-size: clamp(20px, 1.9vw, 25px); font-stretch: 112%; line-height: 1.15; }
.pj h1.xlong { font-size: 18px; font-stretch: 100%; line-height: 1.3; letter-spacing: -.01em; }
.pj .crumbs { font-size: 12px; color: var(--mut); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pj .crumbs a { color: var(--mut); }
.v { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 7px; margin-top: 3px; font-size: 14.5px; font-weight: 550; min-width: 0; }
.v small { font-size: 12px; font-weight: 400; color: var(--mut); }
.tabs { min-height: 44px; display: flex; align-items: stretch; flex-wrap: wrap; padding: 0 clamp(16px, 2.4vw, 32px); border-bottom: 1px solid var(--ink); gap: 4px 28px; }
.tabs a { display: flex; align-items: center; gap: 7px; font-weight: 550; color: var(--mut); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a.on { color: var(--ink); border-color: var(--ink); font-weight: 700; }
.tabs a em { font: 600 11.5px var(--font); font-stretch: 80%; font-style: normal; font-variant-numeric: tabular-nums; }
.tabs .acts { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-block: 8px; }

.page { padding: 22px clamp(16px, 2.4vw, 32px) 64px; display: flex; flex-direction: column; gap: 34px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 384px; gap: 40px; align-items: start; }
.hd { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1.5px solid var(--ink); }
.hd h2 { font-size: 19px; font-weight: 750; font-stretch: 95%; letter-spacing: -.01em; }

/* schedule rows (Needs you) */
.sch { display: flex; flex-direction: column; }
.tier { border-bottom: 1px solid var(--line); }
.tier > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px 16px auto 1fr; align-items: center; gap: 8px; min-height: 32px; background: var(--panel); padding-right: 10px; }
.tier > summary::-webkit-details-marker { display: none; }
.tier > summary .n { font: 600 11px var(--mono); padding-left: 4px; }
.tier > summary b { font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.t-blocking > summary b { background: linear-gradient(transparent 12%, var(--hl) 12% 88%, transparent 88%); color: var(--hl-ink); padding: 0 4px; margin-left: -4px; }
.t-blocking > summary b em { color: var(--hl-ink); }
.tier > summary b em { font: 500 11px var(--mono); font-style: normal; color: var(--mut); margin-left: 6px; }
.tier > summary small { font-size: 12px; color: var(--mut); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tier > summary svg { transition: transform .15s ease-out; color: var(--mut); }
.tier[open] > summary svg { transform: rotate(90deg); }
.it { display: grid; grid-template-columns: 34px 62px minmax(0, 1fr) auto; align-items: start; gap: 0 8px; padding: 10px 10px 10px 0; border-top: 1px solid var(--line); }
.tier > summary + .it { border-top: 0; }
.it .n { font: 400 11px var(--mono); color: var(--faint); padding: 2px 0 0 4px; }
.it > code { padding-top: 2px; display: flex; gap: 5px; align-items: center; }
.it p { margin: 0; font-size: 13.5px; font-weight: 550; line-height: 1.38; }
.it p a:hover { text-decoration: underline; text-decoration-color: var(--line); }
.it .w { display: block; margin-top: 3px; font-size: 12px; color: var(--mut); }
.it .w a { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
.it .act { display: flex; gap: 6px; align-items: center; }
.it.cl { margin: 6px 0; border-top-color: transparent; }
.grp { padding: 8px 10px 10px 42px; border-top: 1px solid var(--line); }
.grp > summary { cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; list-style: none; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary svg { transition: transform .15s ease-out; color: var(--mut); }
.grp[open] > summary svg { transform: rotate(90deg); }
.grp > summary .sp { flex: 1; }
.grp ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.grp li { display: grid; grid-template-columns: 54px 1fr; font-size: 12.5px; color: var(--mut); }
.foot-act { padding: 8px 10px 10px 42px; display: flex; gap: 8px; }

.revs > summary { list-style: none; cursor: pointer; }
.revs > summary::-webkit-details-marker { display: none; }
.revs > summary h2 { display: flex; align-items: center; gap: 8px; }
.revs > summary svg { transition: transform .15s ease-out; color: var(--mut); }
.revs[open] > summary svg { transform: rotate(90deg); }

/* whole rows are targets; the title link stays the keyboard target */
[data-href] { cursor: pointer; }
tr[data-href]:hover > td, .it[data-href]:hover, .ag[data-href]:hover, .pr[data-href]:hover { background-color: var(--panel); }
.tabcl::before { inset: -9px -12px; }
/* definition lists (plans) */
.plan { padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
.plan:last-child { border-bottom: 0; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ph h3 { font-size: 15px; font-weight: 700; }
.dl { display: grid; grid-template-columns: 76px 1fr; column-gap: 12px; margin-top: 10px; }
.dl > .lab { padding-top: 8px; border-top: 1px solid var(--line); }
.dl > div { border-top: 1px solid var(--line); padding: 5px 0 6px; min-width: 0; }
.dl > .lab:first-child, .dl > .lab:first-child + div { border-top: 0; }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) auto 40px; align-items: center; gap: 10px; min-height: 25px; }
.pr > a { display: flex; gap: 6px; align-items: center; min-width: 0; }
.pr > a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr em { font: 500 11px var(--mono); font-style: normal; text-align: right; }
.pr.cl { margin: 9px 0 11px; }
.sub { font-size: 12px; color: var(--mut); }
.ag { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; min-height: 22px; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; padding: 8px 10px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; vertical-align: bottom; font-size: 11px; font-weight: 650; font-stretch: 75%; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.grp-h td { background: var(--panel); font-weight: 700; font-size: 12.5px; padding-block: 7px; }
table.t tr.grp-h.now td { background: var(--blue-soft); color: var(--blue); }
table.t tr.grp-h td em { font: 500 11px var(--mono); font-style: normal; color: var(--mut); margin-left: 6px; }
table.t tr.waits td { color: var(--mut); }
table.t .ttl { font-weight: 600; }
table.t .meta { display: block; font-size: 12px; color: var(--mut); font-weight: 400; margin-top: 2px; }
table.t details summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; }
table.t details summary::-webkit-details-marker { display: none; }
table.t details summary svg { transition: transform .15s ease-out; color: var(--mut); }
table.t details[open] summary svg { transform: rotate(90deg); }
.empty { padding: 18px 0; color: var(--mut); margin: 0; }

/* filters */
.filters { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--ink); }
.seg button { border: 0; border-left: 1px solid var(--ink); background: var(--ground); height: 28px; padding: 0 12px; font-weight: 600; font-size: 12px; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.filters label { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; }
.filters select { appearance: none; height: 28px; border: 1px solid var(--ink); border-radius: 0; color: var(--ink); font: 600 12px var(--font); padding: 0 28px 0 9px; cursor: pointer;
  background-color: var(--ground);
  background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50% 62%, transparent 62%), linear-gradient(-45deg, transparent 50%, var(--ink) 50% 62%, transparent 62%);
  background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.filters select:hover { background-color: var(--panel); }
.filters input[type=checkbox] { appearance: none; width: 15px; height: 15px; margin: 0; border: 1px solid var(--ink); background: var(--ground); display: inline-grid; place-items: center; cursor: pointer; }
.filters input[type=checkbox]::after { content: ""; width: 7px; height: 7px; background: var(--ink); transform: scale(0); transition: transform .12s ease-out; }
.filters input[type=checkbox]:checked::after { transform: scale(1); }

/* docs: markdown with a status margin */
.doc { display: flex; flex-direction: column; }
.blk { display: grid; grid-template-columns: minmax(0, 68ch) minmax(200px, 270px); gap: 0 44px; }
.prose { font-size: 16px; line-height: 1.66; color: var(--ink); }
.prose h2 { font-size: 21px; font-weight: 750; font-stretch: 95%; letter-spacing: -.01em; line-height: 1.25; margin: 30px 0 10px; }
.blk:first-child .prose h2 { margin-top: 4px; }
.prose h3 { font-size: 16.5px; font-weight: 700; margin: 22px 0 6px; }
.prose p { margin: 0 0 14px; }
.prose ul, .prose ol { margin: 0 0 14px; padding-left: 24px; }
.prose li { margin-bottom: 8px; padding-left: 4px; }

Gallformers today treats everything as a species. Taxogall replaces that, in place, on the \`taxogall\` branch.

- **Taxonomy is Facts too.** Names, authorship, placements, synonymies, ranks and splits are Facts credited to the Sources that make them. The tree is whatever the current taxonomic Facts say. Gall naming and plant data stay editorial.

- **The pipeline is the migration** for everything that lives in Sources: existing Sources are re-processed into the new model before release.

## Done when
- Every Fact edit, Gallformers' own included, goes through one ingestion path and one inline editor. {{9a53}} {{64e1}}
- Existing Sources are processed into a copy of production, and a second curator can work the review. {{c887}}
- Production runs on Galls, Facts and Sources, and the old species model is gone. {{9a05}}

2. [[doc:taxogall:import]] **Import at scale runs alongside too.** {{81e9}} Profiling uses a large test package, not the review's dry run, so it no longer waits for the review cleanup.
3. **The edit model's back end.** {{9a53}} One Gallformers Source whose changes are packages, so the Facts the public sees have one history.
4. **Then three things at once:** the one editor {{64e1}}, Gallformers notes as Facts and commentary {{e090}}, and processing Sources on preview {{c887}}, which needs the back end, the import at scale and preview.
5. **Rehearse and cut over** until it's boring, with timing and a rollback. Nothing goes to production before this. {{9a05}}
6. **After release:** drop the old tables and replace the domain docs. {{2e83}}

## Not in this plan
Public pages for non-plant taxa, the phenology explorer, the ID tool's regions and the other later work are ideas in the [backlog](#/g/gallformers/backlog), not steps here.

      blocks.push({ html: `<${ordered ? "ol" : "ul"}>${lis.join("")}</${ordered ? "ol" : "ul"}>`, refs });
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(##|[-*]\s|\d+\.\s)/.test(lines[i])) para.push(lines[i++]);
    const [key, body] = chg(para.join(" "));

function pagePlan(pid, slug, sub) {

  const now = live.filter(e => isNow(e.id)), golive = live.find(e => e.golive);
  const qn = qsFor(x => x.plan === slug).length, docChanged = isChanged(pid, `doc:${slug}:import`);
  const head = titleBlock(h(p.title) + exMark(p), `<a href="#/">All projects</a>${sep}<a href="${P(pid)}">${pid}</a>`, [

    ["Can start now", now.length ? `${now.length} phase${now.length > 1 ? "s" : ""}` : `<span class="mut">none</span>`],
    ["Go live", golive ? `<a href="${L.epic(golive)}">${h(golive.title)}</a>` : `<span class="mut">not set</span>`],

    ["Plan doc", docChanged ? `<a href="${L.plan(p)}/doc">changed</a> <small>since ${PROJECTS[pid].seenAt}</small>` : `<small>no changes since ${PROJECTS[pid].seenAt}</small>`],
  ], true);
  const layers = []; live.forEach(e => (layers[layer(e.id)] ||= []).push(e));
  const goliveLayer = golive ? layer(golive.id) : -1;
  const groups = layers.map((col, i) => [i === goliveLayer ? "Go live" : i === 0 ? "Can start now" : i > goliveLayer && goliveLayer >= 0 ? "After release" : "Then", col]);
  const phaseRow = (e, built) => {
    const st = epicState(e.id), pr = progress(e.id), q = qsFor(x => x.epic === e.id).length, b = blockingFor(x => x.epic === e.id);
    const ch = epicItems(e.id).filter(i => isChanged(pid, i.id)).length;
    return `<tr class="${st !== "now" ? "waits" : ""}${ch ? " cl" : ""}" data-ch="${ch}" data-href="${L.epic(e)}"${built ? " data-built hidden" : ""}><td><code>${e.id}</code></td><td><a class="ttl" href="${L.epic(e)}">${h(e.title)}</a>${e.summary ? `<span class="meta">${h(e.summary)}</span>` : ""}</td>
      <td>${e.prior ? tag("done", "built") : tag(st)}${b ? ` <span class="stamp">${b} blocking</span>` : ""}</td><td>${cells(pr)}</td><td class="n">${pr.total ? `<span class="mono">${pr.done}/${pr.total}</span>` : e.prior ? "" : `<span class="mut">no items</span>`}</td><td class="n">${q || ""}</td>
      <td class="mono">${(e.needs || []).map(n => `<a href="${L.epic(EPICS[n])}" title="${h(EPICS[n].title)}">${n}</a>`).join(" ")}</td></tr>`;
  };
  const phaseTable = eps.length ? `<section><div class="hd"><h2>Where we are</h2><span class="lab">Phases in the order their needs allow</span></div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th style="width:70px">ID</th><th>Phase</th><th>State</th><th>Items</th><th class="n">Done</th><th class="n">Questions</th><th>Needs</th></tr></thead><tbody>
    ${prior.length ? `<tr class="grp-h"><td colspan="7"><details id="built-det"><summary>${ICON_CHEV}Built before mull<em>${prior.length}</em></summary></details></td></tr>${prior.map(e => phaseRow(e, true)).join("")}` : ""}
    ${groups.map(([label, list]) => `<tr class="grp-h${label === "Can start now" ? " now" : ""}"><td colspan="7">${label}<em>${list.length}</em></td></tr>${list.map(e => phaseRow(e)).join("")}`).join("")}
    </tbody></table></div></section>` : "";
  const nowBlock = now.length ? now.map(e => {
    const its = epicItems(e.id).filter(i => i.stage !== "done");
    const show = its.filter(i => i.stage !== "committed").concat(its.filter(i => i.stage === "committed").slice(0, 2));
    const more = its.length - show.length;
    return `<div class="plan"><div class="ph"><h3><a href="${L.epic(e)}">${h(e.title)}</a></h3><span class="mono mut">${progress(e.id).done}/${progress(e.id).total}</span></div>
      <div style="margin-top:8px">${show.map(i => `<div class="ag" style="padding:4px 0" data-href="${L.item(i)}"><a href="${L.item(i)}"><code>${i.id}</code></a><a href="${L.item(i)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(i.title)}</a>${tag(itemStage(i))}</div>`).join("")}
      ${more ? `<div class="sub" style="padding-top:4px">and ${more} more ready</div>` : ""}</div></div>`;
  }).join("") : `<p class="empty">${p.state === "shaping" ? "No phases yet. When you agree the plan, its phases appear here." : "Nothing can start."}</p>`;
  const pb = Object.values(ITEMS).filter(i => i.plan === slug && i.stage === "captured");
  const untri = pb.filter(i => i.untriaged).length, base = L.plan(p);

    <div class="acts">${p.state === "shaping" ? `<button class="btn p" data-cmd="mull plan agree ${slug}">Agree this plan</button>` : ""}<button class="btn" data-seen="${pid}"${CHANGED[pid].size ? "" : " disabled"}>Mark revision seen</button></div></nav>`;
  let body;

const route = () => location.hash.replace(/^#\/?/, "").split("#")[0].split("/").filter(Boolean);
function render() {

function toast(html) {

}
window.addEventListener("hashchange", () => {
  if (location.hash === "#doc") return;
  document.querySelector(".rail").classList.remove("open"); document.getElementById("idx").setAttribute("aria-expanded", "false");
  expandFor(route()); render(); window.scrollTo(0, 0);
});
document.addEventListener("click", ev => {
  if (ev.target.id === "idx") { const r = document.querySelector(".rail"), o = r.classList.toggle("open"); ev.target.setAttribute("aria-expanded", o); return; }
  const tg = ev.target.closest("[data-tg]");
  if (tg) { const k = tg.dataset.tg; EXPANDED.has(k) ? EXPANDED.delete(k) : EXPANDED.add(k); saveTree(); renderTree(route()); return; }
  const row = ev.target.closest("[data-href]");
  if (row && !ev.target.closest("a, button, summary, input, select, label")) {
    if (ev.metaKey || ev.ctrlKey) window.open(row.dataset.href, "_blank"); else location.hash = row.dataset.href;
    return;
  }
  const j = ev.target.closest("[data-jump]");
  if (j) { ev.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({ behavior: "smooth" }); return; }
  const c = ev.target.closest("[data-cmd]");
  if (c) { ev.preventDefault(); toast(`Prototype. This would run <code>${h(c.dataset.cmd)}</code>`); return; }
  const cp = ev.target.closest("[data-copy]");
  if (cp) {
    ev.preventDefault();
    const text = `Let's work through these open mull questions together: ${cp.dataset.copy}. Run mull context for each first.`;
    Promise.resolve().then(() => navigator.clipboard.writeText(text)).then(() => toast("Copied a prompt for an agent. Paste it into your agent session."), () => toast(`Copy this for an agent: <code>${h(text)}</code>`));
    return;
  }
  const seen = ev.target.closest("[data-seen]");
  if (seen) {
    const pid = seen.dataset.seen;
    document.querySelectorAll(".cl").forEach(el => el.classList.add("fading"));
    setTimeout(() => { CHANGED[pid].clear(); PROJECTS[pid].seenAt = "now"; render(); toast(`Revision ${PROJECTS[pid].rev} marked seen. New changes will be clouded.`); }, 360);
    return;
  }
  const bk = ev.target.closest("[data-bk]");
  if (bk) { BL.kind = bk.dataset.bk; render(); return; }
  if (ev.target.id === "f-clear") { Object.assign(BL, { kind: "all", untri: false, plan: "all", cat: "all" }); render(); return; }
  if (ev.target.id === "sim") {
    const id = "c7" + (0x10 + (Object.keys(ITEMS).length % 0xe0)).toString(16).padStart(2, "0");
    ITEMS[id] = { id, project: "gallformers", plan: "taxogall", kind: "bug", category: "performance", title: "Fact inspector: Escape doesn't close it after switching Facts", stage: "captured", by: "agent", source: "7378 session", at: "11-10", untriaged: true };
    CHANGED.gallformers.add(id); FRESH.add(id); PROJECTS.gallformers.rev++; PROJECTS.gallformers.last = "just now";
    render();
    toast(`gallformers' mull branch moved: new capture <code>${id}</code>, clouded in the backlog.`);
  }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "f-untri") { BL.untri = ev.target.checked; render(); }
  if (ev.target.id === "f-plan") { BL.plan = ev.target.value; render(); }
  if (ev.target.id === "f-cat") { BL.cat = ev.target.value; render(); }
});
expandFor(route());
render();
